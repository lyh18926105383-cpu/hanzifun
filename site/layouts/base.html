<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {{robots}}
  <script>
    if (location.pathname.startsWith('/flashcards/') && new URLSearchParams(location.search).has('session')) {
      document.querySelector('meta[name="robots"]').setAttribute('content', 'noindex,follow');
    }
  </script>
  {{seo}}
  <link rel="stylesheet" href="/site-assets/hf06/client/flashcards.css">
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#f6f0e5">
  <title>{{title}} · HanziFun</title>
  <link rel="icon" href="/site-assets/seal.hf03-v1.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/site-assets/site-styles.hf03-v1.css">
  {{pageHead}}
  <script src="/site-assets/site-data.hf03-v1.js" defer></script>
  <script src="/site-assets/site-preview.hf03-v1.js" defer></script>
  <script type="module" src="/site-assets/navigation.hf03-v1.mjs"></script>
</head>
<body class="{{bodyClass}}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{header}}
  <main id="main" tabindex="-1">{{content}}</main>
  {{footer}}
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
